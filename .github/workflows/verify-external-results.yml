name: Verify native external results
on:
  push:
    branches: [codex/verify-native-series]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_CI_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Install desktop development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libudev-dev libasound2-dev libxkbcommon-x11-dev libvulkan-dev libgtk-3-dev
      - name: Compile native entry points and check the generated capability list
        run: |
          cargo run --locked --profile ci -p fieldcraft-cli -- features > "$RUNNER_TEMP/features.md"
          diff -u docs/features.md "$RUNNER_TEMP/features.md"
      - name: Fetch native metadata for offline UI checks
        run: cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu --manifest-path crates/ui-egui/Cargo.toml > /dev/null
      - name: Test touched crates
        run: cargo test --locked --profile ci -p fieldcraft-engine -p fieldcraft-render -p fieldcraft-ui-egui
      - name: Check touched crates with clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --profile ci -p fieldcraft-engine -p fieldcraft-render -p fieldcraft-ui-egui --all-targets -- -D warnings
      - name: Collect downstream diagnostics after a lint failure
        if: ${{ failure() && steps.clippy.outcome == 'failure' }}
        run: cargo clippy --locked --profile ci -p fieldcraft-engine -p fieldcraft-render -p fieldcraft-ui-egui --all-targets
