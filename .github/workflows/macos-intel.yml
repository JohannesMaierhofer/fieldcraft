name: Intel macOS packages

on:
  workflow_dispatch:
  push:
    branches: [codex/verify-intel-integration]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1 # rust-toolchain.toml
        with:
          targets: x86_64-apple-darwin
      - name: Check integral queries and native field rendering
        run: |
          cargo test --locked -p fieldcraft-engine external_integrals
          cargo test --locked -p fieldcraft-render
      - name: Generate third-party licences
        run: cargo xtask licences
      - name: Build and verify the Intel app and CLI
        run: packaging/macos/package.sh --arch x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldcraft-macos-x86_64-${{ github.sha }}
          path: |
            dist/release/fieldcraft-*-macos-x86_64.dmg
            dist/release/fieldcraft-cli-*-macos-x86_64.zip
          if-no-files-found: error
