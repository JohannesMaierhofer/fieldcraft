name: Intel FieldCraft with direct CAD import
on:
  push:
    branches: [codex/verify-step-sc]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '32'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-apple-darwin
      - name: Build and verify the standalone Intel app and CLI
        run: |
          test "$(uname -m)" = x86_64
          cargo xtask licences
          packaging/macos/package.sh --arch x86_64
      - name: Upload the verified Intel disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fieldcraft-step-macos-x86_64
          path: dist/release/*.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Build the local document picker check
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cargo build --locked --release --target x86_64-apple-darwin -p fieldcraft -p fieldcraft-cli -p fieldcraft-ui-egui --example sc_picker_check
          mkdir -p dist/verification
          cp target/x86_64-apple-darwin/release/examples/sc_picker_check dist/verification
          strip -x dist/verification/sc_picker_check
          codesign --force --sign - dist/verification/sc_picker_check
          cd dist/verification && zip -q sc-picker.zip sc_picker_check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sc-picker-macos-x86_64
          path: dist/verification/sc-picker.zip
