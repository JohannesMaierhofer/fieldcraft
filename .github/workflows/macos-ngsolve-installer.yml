name: macOS NGSolve installers

on:
  # Community releases are assembled locally. A maintainer can request a hosted check.
  workflow_dispatch:
    inputs:
      desktop_run:
        description: Repackage native DMGs from a workflow run on the same commit
        type: string
        required: false
permissions:
  contents: read
  actions: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    outputs:
      run: ${{ steps.source.outputs.run }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RUN: ${{ inputs.desktop_run }}
        run: bash packaging/macos/ngsolve/desktop-artifacts.sh
  package:
    needs: source
    name: ${{ matrix.arch }} installer and solver
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            label: intel
            rust_target: x86_64-apple-darwin
            package_arch: x86_64
          - os: macos-15
            arch: arm64
            label: arm64
            rust_target: aarch64-apple-darwin
            package_arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      FIELDCRAFT_VERSION: 0.8.1-ngsolve.r4
      FIELDCRAFT_BUILD_SHA: ${{ github.sha }}
      INSTALLER: FieldCraft-NGSolve-0.8.1-r4-${{ matrix.label }}.pkg
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the verified native desktop DMG
        if: needs.source.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RUN: ${{ needs.source.outputs.run }}
          DESKTOP_SHA: ${{ needs.source.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: bash packaging/macos/ngsolve/restore-desktop.sh
      - uses: dtolnay/rust-toolchain@1.99.1 # rust-toolchain.toml
        if: needs.source.outputs.run == ''
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build native FieldCraft and its CLI
        if: needs.source.outputs.run == ''
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          test "$(uname -m)" = '${{ matrix.arch }}'
          cargo xtask licences
          packaging/macos/package.sh --arch "$PACKAGE_ARCH"
      - name: Publish the verified desktop DMG
        if: needs.source.outputs.run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fieldcraft-desktop-${{ matrix.arch }}-${{ github.sha }}
          path: dist/release/fieldcraft-*-macos-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Assemble the native installer
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app="$RUNNER_TEMP/target/macos-package/FieldCraft.app"
          mkdir -p dist
          cp packaging/ngsolve/SOLVER-NOTICES.txt dist/
          packaging/macos/ngsolve-package.sh --arch "$ARCH" --app "$app" --output "dist/$INSTALLER" --package-version 0.8.1.4 --desktop-revision "$GITHUB_SHA"
          (cd dist && shasum -a 256 "$INSTALLER" > "$INSTALLER.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldcraft-ngsolve-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/FieldCraft-NGSolve-*.pkg
            dist/FieldCraft-NGSolve-*.pkg.sha256
            dist/SOLVER-NOTICES.txt
          if-no-files-found: error
      - name: Install the native product and solve the bundled electric slab
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo /usr/sbin/installer -pkg "dist/$INSTALLER" -target /
          pkgutil --pkg-info org.tangency-labs.fieldcraft.app | grep -Fx 'version: 0.8.1.4'
          home="/Library/Application Support/FieldCraft/NGSolve"
          cmp "packaging/macos/ngsolve/$ARCH.lock" "$home/current/runtime.lock"
          cmp dist/SOLVER-NOTICES.txt "$home/current/NOTICE.txt"
          app=/Applications/FieldCraft.app
          cli="$app/Contents/MacOS/fieldcraft-cli"
          lipo "$cli" -verify_arch "$ARCH"
          test "$("$cli" --version)" = "fieldcraft-cli $FIELDCRAFT_VERSION"
          jq -n --arg path "$PWD/crates/geometry/tests/designs/solidcraft-0.48.1/box.solidcraft" \
            '[{command:"geometry.open",params:{path:$path}},{command:"geometry.tessellate",params:{body:"Box",tolerance:0.05}}]' > "$RUNNER_TEMP/open-solidcraft.json"
          "$cli" run "$RUNNER_TEMP/open-solidcraft.json"
          "$home/python/bin/python3" -I -c 'import platform,sys; assert platform.machine() == sys.argv[1]' "$ARCH"
          pwsh -File packaging/ngsolve/fixtures.ps1 -Directory "$RUNNER_TEMP/slab" -Scenario electrostatic
          cd "$RUNNER_TEMP/slab"
          "$cli" run slab.json
          PYTHONHOME=/unrelated-python PYTHONPATH=/unrelated-python "$home/fieldcraft-ngsolve" run slab.analysis.json result
          "$cli" run result/view-1.json
          jq --arg path "$PWD/result/results.json" '. + [{"command":"results.external.integrals","params":{"path":$path}}]' result/view-2.json > result/view-vector-and-integrals.json
          "$cli" run result/view-vector-and-integrals.json
          "$home/python/bin/python3" -I -c 'import json,math; q=json.load(open("result/results.json"))["integrals"][0]; assert q["name"]=="stored_energy" and math.isclose(q["value"],4.4270939064e-14,rel_tol=1e-9),q'
      - name: Solve the transient slab and check native playback
        shell: pwsh
        run: |
          $fcRuntime = '/Library/Application Support/FieldCraft/NGSolve'
          $fcApp = '/Applications/FieldCraft.app/Contents/MacOS'
          ./packaging/ngsolve/verify-series.ps1 -Python "$fcRuntime/python/bin/python3" -Cli "$fcApp/fieldcraft-cli" -Gui "$fcApp/FieldCraft" -Launcher "$fcRuntime/fieldcraft-ngsolve" -OutputDir "$PWD/verification"
      - name: Upload measured time series, playback states and window captures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fieldcraft-ngsolve-macos-${{ matrix.arch }}-verification
          path: |
            verification/*.json
            verification/*.png
          if-no-files-found: error
          retention-days: 14
