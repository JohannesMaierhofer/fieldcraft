name: macOS NGSolve installers

on:
  push:
    branches: [codex/ngsolve-installers]
    paths-ignore:
      - packaging/ngsolve/control
      - .github/workflows/ngsolve-platforms.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.arch }} installer and solver
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            rust_target: x86_64-apple-darwin
            package_arch: x86_64
          - os: macos-15
            arch: arm64
            rust_target: aarch64-apple-darwin
            package_arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1 # rust-toolchain.toml
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build native FieldCraft and its CLI
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          test "$(uname -m)" = '${{ matrix.arch }}'
          cargo xtask licences
          packaging/macos/package.sh --arch "$PACKAGE_ARCH"
      - name: Publish the verified desktop DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fieldcraft-desktop-${{ matrix.arch }}-${{ github.sha }}
          path: dist/release/fieldcraft-*-macos-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Install the native product and solve the bundled electric slab
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app="$RUNNER_TEMP/target/macos-package/FieldCraft.app"
          mkdir -p dist
          packaging/macos/ngsolve-package.sh --arch "$ARCH" --app "$app" --output "dist/FieldCraft-NGSolve-$ARCH.pkg"
          sudo /usr/sbin/installer -pkg "dist/FieldCraft-NGSolve-$ARCH.pkg" -target /
          pkgutil --pkg-info org.tangency-labs.fieldcraft.ngsolve-runtime
          pkgutil --pkg-info org.tangency-labs.fieldcraft.app
          home="/Library/Application Support/FieldCraft/NGSolve"
          app=/Applications/FieldCraft.app
          cli="$app/Contents/MacOS/fieldcraft-cli"
          lipo "$cli" -verify_arch "$ARCH"
          "$home/python/bin/python3" -I -c 'import platform,sys; assert platform.machine() == sys.argv[1]' "$ARCH"
          mkdir -p "$RUNNER_TEMP/slab"
          cd "$RUNNER_TEMP/slab"
          cp "$home/bridge/samples/"* .
          "$cli" run slab.json
          PYTHONHOME=/unrelated-python PYTHONPATH=/unrelated-python "$home/fieldcraft-ngsolve" case slab.case.json result
          "$cli" run result/view-1.json
          jq --arg path "$PWD/result/results.json" '. + [{"command":"results.external.integrals","params":{"path":$path}}]' result/view-2.json > result/view-vector-and-integrals.json
          "$cli" run result/view-vector-and-integrals.json
          "$home/python/bin/python3" -I -c 'import json,math; q=json.load(open("result/results.json"))["integrals"][0]; assert q["name"]=="stored_energy" and math.isclose(q["value"],4.4270939064e-14,rel_tol=1e-9),q'
      - name: Solve the transient slab and check native playback
        shell: pwsh
        run: |
          $fcRuntime = '/Library/Application Support/FieldCraft/NGSolve'
          $fcApp = '/Applications/FieldCraft.app/Contents/MacOS'
          ./packaging/ngsolve/verify-series.ps1 -Bridge "$fcRuntime/bridge" -Python "$fcRuntime/python/bin/python3" -Cli "$fcApp/fieldcraft-cli" -Gui "$fcApp/FieldCraft" -Launcher "$fcRuntime/fieldcraft-ngsolve" -OutputDir "$PWD/verification"
      - name: Upload measured time series, playback states and window captures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fieldcraft-ngsolve-macos-${{ matrix.arch }}-verification
          path: |
            verification/*.json
            verification/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldcraft-ngsolve-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/FieldCraft-NGSolve-*.pkg
          if-no-files-found: error
